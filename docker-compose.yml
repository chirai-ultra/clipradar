services:
  clipradar:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      # Optional LLM re-rank (any OpenAI-compatible API, or local Ollama):
      # CLIPRADAR_LLM_BASE_URL: http://host.docker.internal:11434/v1
      # CLIPRADAR_LLM_MODEL: llama3.1
      # CLIPRADAR_LLM_API_KEY: ""
      CLIPRADAR_CACHE: /data/cache
    restart: unless-stopped

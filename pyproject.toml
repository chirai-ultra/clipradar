[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipradar"
version = "0.1.0"
description = "Paste a video link, get the best moments as HD shorts. Fuses YouTube 'Most Replayed' data, audio excitement, motion, speech keywords and trends. Works with no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClipRadar contributors" }]
keywords = ["video", "clipping", "shorts", "reels", "tiktok", "highlights", "gameplay", "ffmpeg", "yt-dlp", "whisper"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Environment :: Console",
  "Environment :: Web Environment",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "yt-dlp>=2024.1.0",
  "typer>=0.9",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
faces = ["mediapipe>=0.10"]
qr = ["qrcode>=7.4"]
parakeet = ["sherpa-onnx>=1.10"]
all = ["faster-whisper>=1.0", "mediapipe>=0.10", "qrcode>=7.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
clipradar = "clipradar.cli:main"

[project.urls]
Homepage = "https://github.com/chirai-ultra/clipradar"
Issues = "https://github.com/chirai-ultra/clipradar/issues"

[tool.setuptools.packages.find]
include = ["clipradar*"]

[tool.setuptools.package-data]
clipradar = ["web/static/*", "assets/*"]
